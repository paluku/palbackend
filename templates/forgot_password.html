<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mot de passe oublié — Caisse</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">💰 Caisse</a>
    <nav class="menu">
      <a href="/login">Connexion</a>
    </nav>
  </div>
</header>

<main class="contenu">
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="form-auth">
      <h1>🔐 Mot de passe oublié</h1>
      <p class="sous-titre">Nous vous enverrons un lien de réinitialisation.</p>

      <form method="post" class="formulaire">
        <label>Votre email
          <input type="email" name="email" required autofocus/>
        </label>
        <button type="submit" class="btn-or btn-grand">Envoyer le lien</button>
      </form>

      <p class="lien-bas">
        <a href="/login">← Retour à la connexion</a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
