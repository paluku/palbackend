<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Connexion — Caisse</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">💰 Caisse</a>
    <nav class="menu">
      <a href="/register" class="btn-or">Inscription</a>
    </nav>
  </div>
</header>

<main class="contenu">
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="form-auth">
      <h1>Connexion</h1>
      <p class="sous-titre">Connectez-vous à votre compte</p>

      <form method="post" class="formulaire">
        <label>Email
          <input type="email" name="email" required autofocus/>
        </label>
        <label>Mot de passe
          <input type="password" name="password" required/>
        </label>
        <button type="submit" class="btn-or btn-grand">Se connecter</button>
      </form>

      <p class="lien-bas" style="margin-bottom:8px;">
        <a href="/forgot-password" style="color:#64748b;">🔐 Mot de passe oublié ?</a>
      </p>
      <p class="lien-bas">
        Pas de compte ? <a href="/register">Inscrivez-vous</a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
