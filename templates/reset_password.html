<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nouveau mot de passe — Caisse</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">💰 Caisse</a>
  </div>
</header>

<main class="contenu">
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="form-auth">
      <h1>🔑 Nouveau mot de passe</h1>
      <p class="sous-titre">{{ email }}</p>

      <form method="post" class="formulaire">
        <label>Mot de passe (6 car. min.)
          <input type="password" name="password" minlength="6"
                 required autofocus placeholder="••••••••"/>
        </label>
        <label>Confirmer le mot de passe
          <input type="password" name="password2" minlength="6"
                 required placeholder="••••••••"/>
        </label>
        <button type="submit" class="btn-or btn-grand">Valider</button>
      </form>
    </div>
  </div>
</main>

</body>
</html>
