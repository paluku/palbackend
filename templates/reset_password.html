<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nouveau mot de passe — Caisse</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo">💰 Caisse</a>
  </div>
</header>

<main class="contenu">
  <div class="wrap">
    <div class="form-auth">
      <h1>🔑 Nouveau mot de passe</h1>
      <p class="sous-titre">Pour <b>{{ email }}</b></p>

      <form method="post" class="formulaire">
        <label>Nouveau mot de passe *
          <input type="password" name="password" minlength="6" required autofocus/>
        </label>
        <label>Confirmer *
          <input type="password" name="password2" minlength="6" required/>
        </label>
        <button type="submit" class="btn-or btn-grand">Enregistrer</button>
      </form>

      <p class="lien-bas">
        <a href="/login">← Retour à la connexion</a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
